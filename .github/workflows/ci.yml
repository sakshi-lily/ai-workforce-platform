name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security-and-secrets:
    name: Secret Scanning & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Scan Repository for Accidental Committed Secrets
        working-directory: ./server
        run: npx tsx -e "import { scanRepositoryForSecrets } from './src/cicd/secretAudit'; const res = scanRepositoryForSecrets('../'); if (!res.passed) { console.error('Secrets detected:', res.violations); process.exit(1); } console.log('Secret scan passed:', res.filesScanned, 'files clean.');"

      - name: Audit Server Production Dependencies
        working-directory: ./server
        run: npm audit --omit=dev --audit-level=critical || true

  lint-and-typecheck:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Server Type Check (tsc --noEmit)
        working-directory: ./server
        run: npx tsc --noEmit

      - name: Client Lint & Type Check
        working-directory: ./client
        run: |
          npm run lint || true
          npx tsc -b

  tests-and-regressions:
    name: Unit, Integration & AI Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ai_workforce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: ai_workforce_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret_ci_environment_key_32bytes
      JWT_REFRESH_SECRET: test_refresh_secret_ci_env_key_32bytes
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: platform_knowledge_test
      ENCRYPTION_KEY: ci_test_aes_256_secret_key_32_characters_
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Execute Server Test Suite & AI Regressions
        working-directory: ./server
        run: npm run test:phase23

  application-builds:
    name: Build Frontend & Backend Applications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Server Distribution (tsc)
        working-directory: ./server
        run: |
          npm ci
          npm run build

      - name: Build Client Distribution (Vite)
        working-directory: ./client
        run: |
          npm ci
          npm run build

  docker-build-verification:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: docker build -f docker/Dockerfile.api -t ai-workforce-api:ci-test .

      - name: Build Worker Docker Image
        run: docker build -f docker/Dockerfile.worker -t ai-workforce-worker:ci-test .

      - name: Build Client Docker Image
        run: docker build -f docker/Dockerfile.client -t ai-workforce-client:ci-test .

      - name: Verify API Container Runtime & Liveness Probe
        run: |
          docker run -d --name test-api -p 3000:3000 \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e JWT_SECRET=test_jwt_secret_ci_verification_key_32bytes \
            ai-workforce-api:ci-test
          
          echo "Awaiting API container readiness..."
          HEALTHY=0
          for i in {1..20}; do
            if curl -sf http://localhost:3000/api/health/liveness; then
              echo "API container successfully responded to /api/health/liveness"
              HEALTHY=1
              break
            fi
            sleep 1
          done
          
          if [ $HEALTHY -ne 1 ]; then
            echo "API container failed liveness health check!"
            docker logs test-api
            exit 1
          fi

          curl -sf http://localhost:3000/api/health
          docker rm -f test-api

      - name: Verify Client Container Runtime & Nginx Health
        run: |
          docker run -d --name test-client -p 8080:80 \
            ai-workforce-client:ci-test
          
          echo "Awaiting Client container readiness..."
          CLIENT_HEALTHY=0
          for i in {1..10}; do
            if curl -sf http://localhost:8080/healthz; then
              echo "Client Nginx container successfully responded to /healthz"
              CLIENT_HEALTHY=1
              break
            fi
            sleep 1
          done
          
          if [ $CLIENT_HEALTHY -ne 1 ]; then
            echo "Client container failed healthz check!"
            docker logs test-client
            exit 1
          fi

          docker rm -f test-client

      - name: Verify Headless Worker Container Security & Process Execution
        run: |
          RUNNING_USER=$(docker run --rm ai-workforce-worker:ci-test whoami)
          if [ "$RUNNING_USER" != "node" ]; then
            echo "Security violation: Worker container running as '$RUNNING_USER' instead of unprivileged 'node' user"
            exit 1
          fi
          echo "Worker unprivileged non-root user verified: $RUNNING_USER"
          docker run --rm ai-workforce-worker:ci-test node -e "console.log('Worker daemon runtime verified OK')"

      - name: Clean Up Test Containers
        if: always()
        run: docker rm -f test-api test-client 2>/dev/null || true

